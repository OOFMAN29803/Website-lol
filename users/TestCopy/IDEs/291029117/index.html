 <script>
let saveTimer; 
let isTyping = false; // Flag to detect user typing

function saveContent() {
    clearTimeout(saveTimer); 

    saveTimer = setTimeout(() => {
        const content = document.getElementById('codingSpace').value;
        fetch('save.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `content=${encodeURIComponent(content)}`,
        })
            .then(response => response.text())
            .then(data => console.log('Saved:', data))
            .catch(error => console.error('Error saving content:', error));
    }, 301); // Delay in milliseconds
}

window.onload = function() {
    fetch('fetch.php')
        .then(response => response.text())
        .then(data => {
            document.getElementById('codingSpace').value = data;
        })
        .catch(error => console.error('Error fetching content:', error));
};

// Function to fetch periodically
function onTimeSaveModule() {
    if (!isTyping) { // Only fetch if the user is not typing
        fetch('fetch.php')
            .then(response => response.text())
            .then(data => {
                document.getElementById('codingSpace').value = data;
            })
            .catch(error => console.error('Error fetching content:', error));
    }
}

// Event listeners to detect typing
document.getElementById('codingSpace').addEventListener('input', () => {
    isTyping = true; // User started typing
    saveContent(); // Trigger save
});

document.getElementById('codingSpace').addEventListener('blur', () => {
    isTyping = false; // User stopped typing (blur event)
});

// Set interval for periodic fetching
setInterval(onTimeSaveModule, 300); // Increase interval to avoid excessive fetches

    </script>
