<?php
session_start();

if ($_SERVER["REQUEST_METHOD"] == "POST") {
    $username = $_POST['username'];
    $password = $_POST['password'];

    // Define the path to the user's data
    $user_file = "users/$username/user.json";
    $profile_page = "profile.php";

    // Check if user exists
    if (file_exists($user_file)) {
        // Read user data from the file
        $user_data = json_decode(file_get_contents($user_file), true);

        // Verify the password
        if (password_verify($password, $user_data['password'])) {
            // Set session token
            $_SESSION['session_token'] = $user_data['session_token'];

            // Redirect to the user's profile page with session token
            header("Location: $profile_page");
            exit();
        } else {
            echo "Incorrect password. Please try again.";
        }
    } else {
        echo "User not found. Please sign up first.";
    }
}
