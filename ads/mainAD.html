<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AllOneTech - Final Slides with Giant Mini</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" 
    rel="stylesheet"
  >

  <!-- GSAP Core (no integrity to avoid any SRI issues) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- GSAP TextPlugin for typed text effect -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

  <style>
    /* RESET & BASE STYLES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* No scroll - ad style */
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }

    /* BACKGROUND: Animated gradient + swirling shapes */
    body {
      background: linear-gradient(120deg, #e7effd, #ffffff, #eef7ff);
      background-size: 300% 300%;
      animation: gradientShift 20s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* DRIFTING SHAPES */
    .swirl {
      position: absolute;
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(40px);
      pointer-events: none; /* ignore mouse events */
      z-index: 0; /* behind slides */
    }

    /* SLIDES */
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 2rem;
      opacity: 0;         /* hidden by default */
      transform: scale(0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;         /* above background shapes */
    }

    /* HEADLINE & SUBHEAD */
    .headline {
      font-size: 4rem;
      font-weight: 900;
      margin: 1rem 0;
      color: #1a202c;
      line-height: 1.2;
    }
    .subhead {
      font-size: 2rem;
      font-weight: 700;
      margin: 1rem 0;
      color: #2d3748;
    }

    /* MAIN LOGO */
    .logo {
      width: auto;
      height: 400px; /* Large main logo */
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
    }

    /* FEATURE -> DROPS */
    .feature-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .feature-text {
      font-size: 4rem;
      font-weight: 900;
      color: #1a202c;
    }
    .drops-text {
      font-size: 4rem;
      font-weight: 900;
      color: #e53e3e;
      position: absolute;
      top: 0; left: 0; right: 0;
      margin: auto;
      text-align: center;
      opacity: 0;
    }
    .per-week {
      font-size: 2rem;
      font-weight: 400;
      color: #4a5568;
      margin-top: 1rem;
      opacity: 0;
      transform: scale(0.9);
    }

    /* PRODUCTS SLIDE (MINI LOGOS) */
    .products-container {
      display: flex;
      gap: 3rem;
      margin-top: 2rem;
    }
    .mini-logo {
      width: auto;
      height: 180px;
      opacity: 0;
      transform: scale(0.9);
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.1));
    }

    /* SLIDE 7: final-subhead + final-mini */
    .final-subhead {
      font-size: 2.5rem;
      font-weight: 700;
      color: #2d3748;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(20px);
    }
    .final-mini {
      width: auto;
      height: 300px;
      margin-top: 1rem;
      opacity: 0;
      transform: scale(0.8);
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
    }

    /* SLIDE 8: only giant AllOneTechMini (no text) */
    .giant-mini {
      width: auto;
      height: 350px;
      opacity: 0;
      transform: scale(0.8);
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }
  </style>
</head>
<body>

  <!-- DRIFTING SHAPES for the background -->
  <div class="swirl" style="width:300px; height:300px; background-color:#86b7ff;"></div>
  <div class="swirl" style="width:220px; height:220px; background-color:#ff6b6b;"></div>
  <div class="swirl" style="width:180px; height:180px; background-color:#ffd93d;"></div>
  <div class="swirl" style="width:250px; height:250px; background-color:#a3ffac;"></div>
  <div class="swirl" style="width:280px; height:280px; background-color:#b28dff;"></div>
  <div class="swirl" style="width:200px; height:200px; background-color:#cd5d7d;"></div>
  <div class="swirl" style="width:160px; height:160px; background-color:#ff6b5;"></div>
  <div class="swirl" style="width:300px; height:300px; background-color:#4d96ff;"></div>
  <div class="swirl" style="width:260px; height:260px; background-color:#6bcb77;"></div>

  <!-- 9 SLIDES total -->

  <!-- Slide 0 -->
  <div class="slide" id="slide0">
    <img src="AllOneTech.svg" alt="AllOneTech Logo" class="logo">
    <div class="subhead" data-text="AllOneTech.site"></div>
  </div>

  <!-- Slide 1 -->
  <div class="slide" id="slide1">
    <div class="headline" data-text="A startup to change the world"></div>
  </div>

  <!-- Slide 2 -->
  <div class="slide" id="slide2">
    <div class="headline" data-text="The startup built around you"></div>
  </div>

  <!-- Slide 3 (Feature->Drops) -->
  <div class="slide" id="slide3">
    <div class="feature-container">
      <div class="feature-text" id="featureText">FEATURE</div>
      <div class="drops-text" id="dropsText">DROPS</div>
      <div class="per-week" id="perWeekTxt">per week</div>
    </div>
  </div>

  <!-- Slide 4 -->
  <div class="slide" id="slide4">
    <div class="headline" data-text="Helpfulness guaranteed"></div>
    <div class="subhead">Feedback almost always implemented</div>
  </div>

  <!-- Slide 5 -->
  <div class="slide" id="slide5">
    <div class="headline" data-text="Full transparency"></div>
    <div class="subhead" data-text="For you"></div>
  </div>

  <!-- Slide 6 -->
  <div class="slide" id="slide6">
    <div class="headline" data-text="Active development"></div>
    <div class="subhead">on new products</div>
    <div class="products-container">
      <img src="AllOneAIMini.svg" alt="AllOneAI Mini Logo" class="mini-logo" id="logoAIMini">
      <img src="AllOneIDEMini.svg" alt="AllOneIDE Mini Logo" class="mini-logo" id="logoIDEMini">
      <img src="AllOneStorageMini.svg" alt="AllOneStorage Mini Logo" class="mini-logo" id="logoStorageMini">
      <img src="AllOneMini.svg" alt="AllOne Mini Logo" class="mini-logo" id="logoAllOneMini">
    </div>
  </div>

  <!-- Slide 7 -->
  <div class="slide" id="slide7">
    <div class="headline" data-text="Cheaper than almost all of the market"></div>
    <div class="final-subhead" data-text="Sign Up Today!"></div>
    <img src="AllOneTechMini.svg" alt="AllOneTechMini" class="final-mini" id="finalMiniLogo">
  </div>

  <!-- Slide 8 -->
  <div class="slide" id="slide8">
    <img src="AllOneTechMini.svg" alt="AllOneTechMini" class="giant-mini" id="giantMiniLogo">
  </div>

  <script>
    gsap.registerPlugin(TextPlugin);

    /* (1) Drifting swirl shapes */
    const shapes = document.querySelectorAll(".swirl");
    shapes.forEach(shape => {
      randomDrift(shape);
    });

    function randomDrift(el) {
      gsap.set(el, {
        x: gsap.utils.random(0, window.innerWidth - parseFloat(el.style.width)),
        y: gsap.utils.random(0, window.innerHeight - parseFloat(el.style.height))
      });
      drift(el);
    }
    function drift(el) {
      gsap.to(el, {
        duration: gsap.utils.random(8, 16),
        x: gsap.utils.random(0, window.innerWidth - parseFloat(el.style.width)),
        y: gsap.utils.random(0, window.innerHeight - parseFloat(el.style.height)),
        ease: "power1.inOut",
        onComplete: () => drift(el)
      });
    }

    /* (2) Slides & Master Timeline */
    const slides = gsap.utils.toArray(".slide");
    console.log("Slides found:", slides.map(s => s.id)); 
    // Expect 9 slides: slide0..slide8

    gsap.set(slides, { opacity: 0, scale: 0.9 });

    const masterTL = gsap.timeline({ defaults: { ease: "power2.inOut" } });

    slides.forEach((slide, i) => {
      if (i === 3) {
        // Slide 3: Feature->Drops
        masterTL
          .to(slide, { opacity: 1, scale: 1, duration: 1.2 })
          .call(doFeatureDrops)
          .to(slide, {}, "+=3")
          .to(slide, { opacity: 0, scale: 0.9, duration: 1 });
      }
      else if (i === 6) {
        // Slide 6: fade in 4 mini logos
        masterTL
          .to(slide, { opacity: 1, scale: 1, duration: 1.2 })
          .call(() => doTyping(slide))
          .call(() => fadeInMiniLogos(), null, "+=0.4")
          .to(slide, {}, "+=3")
          .to(slide, { opacity: 0, scale: 0.9, duration: 1 });
      }
      else if (i === 7) {
        // Slide 7: typed "Cheaper..." & "Sign Up Today!" + fade in final mini
        masterTL
          .to(slide, { opacity: 1, scale: 1, duration: 1.2 })
          .call(() => doTyping(slide))
          .from("#finalMiniLogo", {
            opacity: 0,
            scale: 0.8,
            duration: 0.8,
            ease: "back.out(1.4)"
          }, "+=0.5")
          .to(slide, {}, "+=3")
          .to(slide, { opacity: 0, scale: 0.9, duration: 1 }); // fade out so next slide is visible
      }
      else if (i === 8) {
        // Slide 8: giant mini only, stays at end
        masterTL
          .to(slide, { opacity: 1, scale: 1, duration: 1.2 })
          .from("#giantMiniLogo", {
            opacity: 0,
            scale: 0.7,
            duration: 1,
            ease: "back.out(1.6)"
          }, "+=0.5")
          .to(slide, {}, "+=3"); // remain visible
      }
      else {
        // Standard slides
        masterTL
          .to(slide, { opacity: 1, scale: 1, duration: 1.2 })
          .call(() => doTyping(slide))
          .to(slide, {}, "+=3")
          .to(slide, { opacity: 0, scale: 0.9, duration: 1 });
      }
    });

    // If you want an infinite loop: masterTL.repeat(-1);

    /* (3) Feature->Drops Crossfade */
    function doFeatureDrops() {
      const featureText = document.getElementById("featureText");
      const dropsText   = document.getElementById("dropsText");
      const perWeekTxt  = document.getElementById("perWeekTxt");

      gsap.timeline()
        .to(featureText, { duration: 0.8, opacity: 0 }, "+=1")
        .to(dropsText,   { duration: 0.8, opacity: 1 }, "<0.2")
        .to(perWeekTxt,  { duration: 0.8, opacity: 1, scale: 1, ease: "back.out(1.7)" }, "+=0.4");
    }

    /* (4) Fade in 4 mini logos (Slide 6) */
    function fadeInMiniLogos() {
      const logos = ["#logoAIMini","#logoIDEMini","#logoStorageMini","#logoAllOneMini"];
      gsap.set(logos, { opacity: 0, scale: 0.9 });
      gsap.to(logos, {
        duration: 0.8,
        opacity: 1,
        scale: 1,
        stagger: 0.2,
        ease: "back.out(1.4)"
      });
    }

    /* (5) Typing effect for headlines/subheads with [data-text] */
    function doTyping(slide) {
      // HEADLINE
      let hl = slide.querySelector(".headline[data-text]");
      if (hl) {
        const txt = hl.getAttribute("data-text") || "";
        hl.textContent = "";
        gsap.to(hl, {
          duration: txt.length * 0.06,
          text: txt,
          ease: "none"
        });
      }
      // SUBHEAD or final-subhead
      let sh = slide.querySelector(".subhead[data-text], .final-subhead[data-text]");
      if (sh) {
        const txt2 = sh.getAttribute("data-text") || "";
        sh.textContent = "";
        gsap.to(sh, {
          duration: txt2.length * 0.06,
          text: txt2,
          ease: "none",
          delay: 0.5
        });
      }
    }
  </script>
</body>
</html>
