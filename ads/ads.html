<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllOneTech Animation</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
        }

        .animation-container {
            position: relative;
            width: 400px;
            height: 200px;
        }

        .svg-logo {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: transform 0.5s ease-in, opacity 0.3s;
        }

        .svg-logo.active {
            opacity: 1;
            transform: translateY(0);
        }

        .svg-logo.falling {
            transform: translateY(-200px);
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <img src="AllOneTech.svg" alt="AllOneTech" class="svg-logo active" id="allone-tech">
        <img src="AllOneLabs.svg" alt="AllOneLabs" class="svg-logo falling" id="allone-labs">
        <img src="AllOneStorage.svg" alt="AllOneStorage" class="svg-logo falling" id="allone-storage">
        <img src="AllOneWeb.svg" alt="AllOneWeb" class="svg-logo falling" id="allone-web">
        <img src="AllOneAIFull.svg" alt="AllOneAI" class="svg-logo falling" id="allone-ai">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const techLogo = document.getElementById('allone-tech');
            const flickLogos = [
                document.getElementById('allone-labs'),
                document.getElementById('allone-storage'),
                document.getElementById('allone-web'),
                document.getElementById('allone-ai')
            ];

            let currentIndex = 0;

            function showNextLogo() {
                // Hide all flick logos
                flickLogos.forEach(logo => logo.classList.remove('active'));
                
                // Show the next logo
                const nextLogo = flickLogos[currentIndex];
                nextLogo.classList.add('active');
                nextLogo.classList.remove('falling');

                // Update the index
                currentIndex = (currentIndex + 1) % flickLogos.length;
            }

            // Change logo every 0.5 seconds for a fast-paced effect
            setInterval(() => {
                // Make the current flick logo fall before hiding it
                flickLogos.forEach(logo => logo.classList.add('falling'));
                
                setTimeout(showNextLogo, 100);
            }, 500);
        });
    </script>
</body>
</html>
