<div class="containerDivFunctions">
<center>
<button onclick="sampleiFrame()" class="buttonRun">Run</button>
<button onclick="fullscreen()" class="buttonRun" id="buttonFull">⛶</button>
<button onclick="copyLink()" class="buttonRun">Share</button>

<div class="containerDivFunctions">
<center>
<button class="buttonRun" id="pyButton" onclick="changePythony()" style="width: 48%;" >Python</button><button class="buttonRun" id="pyButton" onclick="changeHTML()" style="width: 48%;" >HTML</button>
</center>

<center>
<button class="buttonRun" style="width: 22%;">Files</button><button class="buttonRun" style="width: 22%;">Users</button><button class="buttonRun" style="width: 35%;">Actions</button><button class="buttonRun" style="text-align: center;">+</button>
</center>

</div>
<button onclick="offscreen()" id="buttonNoFullScreen" >Exit</button>
<script src="main.js"></script>
 <script>
        function fetchContent() {
            fetch('fetch.php')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('codingSpace').value = data;
                })
                .catch(error => console.error('Error fetching content:', error));
        }

        function saveContent() {
            const content = document.getElementById('codingSpace').value;
            fetch('save.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `content=${encodeURIComponent(content)}`,
            })
                .then(response => response.text())
                .then(data => console.log(data))
                .catch(error => console.error('Error saving content:', error));
        }


        window.onload = fetchContent;
    </script>
</body>

</html>
